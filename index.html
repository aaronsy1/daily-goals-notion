<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #ffffff;
            --text: #37352f;
            --accent: #2383e2;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #191919; --text: #ffffff; --accent: #2eaadc; }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 10px; margin: 0; }
        h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; margin-bottom: 10px; }
        .input-group { display: flex; gap: 5px; margin-bottom: 15px; }
        input[type="text"] { flex-grow: 1; border: 1px solid rgba(125,125,125,0.3); border-radius: 4px; padding: 5px; background: transparent; color: inherit; }
        button { cursor: pointer; background: var(--accent); color: white; border: none; border-radius: 4px; padding: 5px 10px; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 15px; }
        input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }
        .completed { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body>

    <h3>Goals for Today</h3>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a goal...">
        <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>

    <script>
        const taskList = document.getElementById('taskList');
        const taskInput = document.getElementById('taskInput');

        // Check if it's a new day
        function checkDailyReset() {
            const lastDate = localStorage.getItem('lastResetDate');
            const today = new Date().toDateString();

            if (lastDate !== today) {
                localStorage.removeItem('goals');
                localStorage.setItem('lastResetDate', today);
            }
        }

        function loadTasks() {
            checkDailyReset();
            const goals = JSON.parse(localStorage.getItem('goals') || '[]');
            taskList.innerHTML = '';
            goals.forEach((goal, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <input type="checkbox" ${goal.completed ? 'checked' : ''} onclick="toggleTask(${index})">
                    <span class="${goal.completed ? 'completed' : ''}">${goal.text}</span>
                `;
                taskList.appendChild(li);
            });
        }

        function addTask() {
            if (!taskInput.value) return;
            const goals = JSON.parse(localStorage.getItem('goals') || '[]');
            goals.push({ text: taskInput.value, completed: false });
            localStorage.setItem('goals', JSON.stringify(goals));
            taskInput.value = '';
            loadTasks();
        }

        function toggleTask(index) {
            const goals = JSON.parse(localStorage.getItem('goals') || '[]');
            goals[index].completed = !goals[index].completed;
            localStorage.setItem('goals', JSON.stringify(goals));
            loadTasks();
        }

        // Allow "Enter" key to add task
        taskInput.addEventListener("keypress", (e) => { if (e.key === "Enter") addTask(); });

        loadTasks();
    </script>
</body>
</html>
